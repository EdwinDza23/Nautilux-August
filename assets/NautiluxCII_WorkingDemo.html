function parseExcelUpload(file){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{header:1});
      // Try to find vessel data — look for column headers
      let headers=null,rows=[];
      for(let i=0;i<data.length;i++){
        const row=data[i];
        if(!row)continue;
        const rowStr=row.map(c=>String(c||'').toLowerCase()).join('|');
        if(rowStr.includes('vessel')||rowStr.includes('imo')||rowStr.includes('fuel')||rowStr.includes('dwt')){
          headers=row.map(c=>String(c||'').toLowerCase().trim());
          for(let j=i+1;j<data.length;j++){if(data[j]&&data[j].some(c=>c))rows.push(data[j]);}
          break;
        }
      }
      if(!headers||rows.length===0){
        // Fallback: try key-value pairs (Field | Value format)
        const kv={};
        data.forEach(r=>{if(r&&r[0]&&r[1])kv[String(r[0]).toLowerCase().trim()]=r[1];});
        if(Object.keys(kv).length>3){
          applyKVData(kv);
          return;
        }
        alert('Could not find vessel data in Excel. Expected column headers (vessel, imo, fuel, distance, etc) or key-value pairs.');
        return;
      }
      // Map headers to fields
      const hmap={};
      const aliases={
        'vessel':'nm','vessel name':'nm','name':'nm','imo':'imo','imo number':'imo',
        'type':'tp','vessel type':'tp','subtype':'sub','sub type':'sub',
        'dwt':'dwt','deadweight':'dwt','build year':'yr','year':'yr','year built':'yr',
        'flag':'fl','flag state':'fl','class':'cl','class society':'cl',
        'fuel':'fuel','fuel consumed':'fuel','fuel (mt)':'fuel','fuel mt':'fuel','annual fuel':'fuel',
        'distance':'dist','distance (nm)':'dist','distance nm':'dist','annual distance':'dist',
        'sea days':'dy','days':'dy','days at sea':'dy',
        'speed':'spd','avg speed':'spd','average speed':'spd',
        'fuel type':'ft','primary fuel':'ft',
        'co2':'co2','co2 tonnes':'co2','emissions':'co2',
        'engine':'me','main engine':'me','me type':'me',
        'mcr':'mcr','mcr (kw)':'mcr',
      };
      headers.forEach((h,i)=>{const key=aliases[h];if(key)hmap[key]=i;});
      // Parse rows into vessel objects
      const vessels=rows.map(r=>{
        const v={};
        Object.entries(hmap).forEach(([field,idx])=>{v[field]=r[idx];});
        return v;
      }).filter(v=>v.nm||v.imo);
      if(vessels.length>0){
        applyExcelVessels(vessels);
      } else {
        alert('Found headers but no data rows.');
      }
    }catch(err){
      alert('Error reading Excel: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function applyKVData(kv){
  // Single vessel key-value format
  const el=document.getElementById('excel-status');
  if(el)el.innerHTML='<span style="color:#2D6A4F;font-weight:700">\u2713 Loaded 1 vessel from Excel</span>';
  // Fill form fields if the form is open
  const fields=document.querySelectorAll('#form-step2 input');
  const map={'fuel':'fuel','fuel (mt)':'fuel','fuel consumed':'fuel','distance':'dist','distance (nm)':'dist','sea days':'dy','days':'dy','port days':'portDays','speed':'spd','avg speed':'spd'};
  Object.entries(kv).forEach(([k,v])=>{
    const field=map[k];
    if(field){
      fields.forEach(input=>{
        if(input.dataset.field===field)input.value=v;
      });
    }
  });
}

function applyExcelVessels(vessels){
  const el=document.getElementById('excel-status');
  if(el)el.innerHTML='<span style="color:#2D6A4F;font-weight:700">\u2713 Loaded '+vessels.length+' vessel(s) from Excel</span>';
  // Store for later use
  window._excelVessels=vessels;
  console.log('Excel vessels loaded:',vessels);
}

        h+=`<td class="mo" style="font-size:12px">${v.imo}</td>`;

function handleExcelUpload(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  input.value='';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws);
      const aliases={
        'vessel name':'nm','vessel':'nm','name':'nm','ship name':'nm',
        'imo':'imo','imo number':'imo','imo no':'imo',
        'type':'tp','vessel type':'tp','ship type':'tp',
        'subtype':'sub','sub type':'sub',
        'dwt':'dwt','deadweight':'dwt','dwt (mt)':'dwt',
        'fuel':'fuel','fuel consumed':'fuel','fuel (mt)':'fuel','fuel mt':'fuel','annual fuel':'fuel','total fuel':'fuel',
        'distance':'dist','distance (nm)':'dist','distance nm':'dist','total distance':'dist','annual distance':'dist',
        'sea days':'dy','days':'dy','days at sea':'dy','sailing days':'dy',
        'speed':'spd','avg speed':'spd','average speed':'spd',
        'fuel type':'ft','primary fuel':'ft',
        'build year':'yr','year built':'yr','year':'yr',
        'flag':'fl','flag state':'fl',
        'class':'cl','class society':'cl',
      };
      const parsed=rows.map(row=>{
        const v={tp:'Tanker',ft:'VLSFO',dy:250,eu_eu:30,eu_non:25,non_eu:25,non_non:20};
        Object.entries(row).forEach(([k,val])=>{
          const kl=k.toLowerCase().trim();
          const field=aliases[kl];
          if(field){
            if(['dwt','fuel','dist','dy'].includes(field))v[field]=Number(String(val).replace(/,/g,''))||0;
            else v[field]=String(val);
          }
        });
        return v;
      }).filter(v=>v.nm||v.imo);
      if(parsed.length>0){
        parsed.forEach(v=>VL.push(v));
        render();
        setTimeout(()=>{
          const el=document.getElementById('upload-status');
          if(el)el.innerHTML=`<div style="background:#E8F5E9;border-left:3px solid #2D6A4F;border-radius:6px;padding:12px 18px;margin-bottom:16px;font-family:var(--ui);font-size:12px;color:#2D6A4F;font-weight:600">✓ Loaded ${parsed.length} vessel(s) from ${file.name}</div>`;
        },50);
      } else {
        alert('No vessel data found. Check that your Excel has column headers like: Vessel Name, IMO, DWT, Fuel, Distance, Sea Days');
      }
    }catch(err){alert('Error reading file: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

function updateVessel(i,field,value){
  VL[i][field]=value;
  // Recompute derived fields
  const v=VL[i];
  const cf=v.ft==='MGO'?3.206:v.ft==='LNG'?2.75:3.114;
  if(v.fuel&&v.dist&&v.dwt){
    v.co2=Math.round(v.fuel*cf);
    v.cii=parseFloat(((v.fuel*cf*1e6)/(v.dwt*v.dist)).toFixed(2));
    v.ds=v.dwt.toLocaleString();
    // Rating
    const coeffs={Tanker:{a:5247.2,c:0.610,dd:[0.82,0.93,1.08,1.28]},Bulk:{a:4745.3,c:0.622,dd:[0.86,0.94,1.06,1.18]},General:{a:588.0,c:0.380,dd:[0.83,0.94,1.06,1.19]},Container:{a:1984.0,c:0.489,dd:[0.83,0.94,1.07,1.19]}};
    const cc=coeffs[v.tp]||coeffs.Tanker;
    const ref=cc.a*Math.pow(v.dwt,-cc.c);
    const req=ref*(1-0.11);
    if(v.cii<=req*cc.dd[0])v.rt='A';
    else if(v.cii<=req*cc.dd[1])v.rt='B';
    else if(v.cii<=req*cc.dd[2])v.rt='C';
    else if(v.cii<=req*cc.dd[3])v.rt='D';
    else v.rt='E';
    // EU ETS estimate
    const eff=(v.eu_eu||30)/100+(v.eu_non||25)/200+(v.non_eu||25)/200;
    v.ets=Math.round(v.co2*eff*75/1000);
    // FuelEU estimate
    const ghg=v.ft==='LNG'?72.6:v.ft==='MGO'?92.43:91.74;
    v.ghg=ghg;v.ghgL=89.34;
    const deficit=ghg-89.34;
    v.ghgD=deficit>0?'+'+deficit.toFixed(2):deficit.toFixed(2);
    v.fue=deficit>0?Math.round(deficit/89.34*v.fuel*(v.ft==='MGO'?42700:40500)*eff*2400/41000/1000):0;
    v.ghgP=v.fue>0?'€'+v.fue+'K':'€0';
    // Risk
    if(v.rt==='E')v.rk='Critical';
    else if(v.rt==='D')v.rk='High';
    else if(v.rt==='C')v.rk='Medium';
    else v.rk='Low';
    v.pp=deficit>0.1?'Misaligned':deficit>-0.05?'Marginal':'Aligned';
    v.r30=v.rt;v.cap=v.rt==='E'?'2026':v.rt==='D'?'2027':'---';
  }
  render();
}

  if(col==="fue")return dir*(b.fue-a.fue);
  if(col==="nm")return dir*a.nm.localeCompare(b.nm);
  if(col==="cap"){const ca=a.cap==="---"?9999:+a.cap,cb=b.cap==="---"?9999:+b.cap;return dir*(ca-cb);}
  return 0;
});
fs.forEach((x,i)=>{const ri=VL.indexOf(x);h+=`<div class="vrow" onclick="setState({sel:${ri},tab:0})" style="display:grid;grid-template-columns:32px 1fr 55px 30px 78px 85px 50px 55px 62px;gap:8px;align-items:center;padding:10px 16px">${rg(x.rt)}<div style="min-width:0"><div class="ui" style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.nm}</div><div class="ui" style="font-size:11px;color:${C.gr};margin-top:1px">${x.sub} \u00b7 ${x.ds} DWT</div></div><div class="mo" style="font-size:13px;font-weight:700;color:${(RT[x.rt]||{c:C.gr}).c};text-align:center">${x.cii.toFixed(2)}</div><div style="text-align:center">${rg(x.r30)}</div><div style="text-align:center">${tag(x.rk)}</div><div style="text-align:center">${tag(x.pp)}</div><div class="mo" style="font-size:11px;color:${x.cap!=="---"?C.rd:C.sv};font-weight:${x.cap!=="---"?700:400};text-align:right">${x.cap}</div><div class="ui" style="font-size:11px;font-weight:600;color:${C.og};text-align:right">\u20ac${x.fue}K</div><div class="ui" style="font-size:11px;font-weight:600;color:${C.rd};text-align:right">\u20ac${x.ets}K</div></div>`;});
h+=`</div></div>`;

// Modal overlay + content
h+=`<div class="ov${state.modal?" open":""}" onclick="setState({modal:null})"></div><div class="mdl${state.modal?" open":""}">${state.modal?modalHTML():""}</div>`;

// Slide-over
const sOpen=state.sel!==null&&!state.modal;
h+=`<div class="ov${sOpen?" open":""}" onclick="setState({sel:null})"></div>`;
h+=`<div class="sl${state.sel!==null?" open":""}">`;
if(v){
h+=`<div style="padding:16px 24px;background:${C.ch};display:flex;justify-content:space-between;align-items:center;flex-shrink:0"><div><div style="font-size:17px;font-weight:600;color:${C.w}">${v.nm}</div><div class="ui" style="font-size:11px;color:${C.gl};margin-top:2px">IMO ${v.imo} \u00b7 ${v.sub} \u00b7 ${v.ds} DWT</div><div class="ui" style="font-size:11px;color:#FFA726;margin-top:3px">AI Risk: ${v.rk} \u2014 CII ${v.cii.toFixed(2)}</div></div>`;
h+=`<div style="display:flex;gap:10px;align-items:center"><span style="display:inline-flex;width:36px;height:36px;border-radius:5px;font-family:var(--mo);font-weight:700;font-size:18px;align-items:center;justify-content:center;background:${(RT[v.rt]||{b:C.dk}).b};color:${(RT[v.rt]||{c:C.gr}).c}">${v.rt}</span>${tag(v.rk)}${v.cap!=="---"?`<span class="mo" style="font-size:13px;font-weight:700;color:${C.rd};background:${C.rdB};padding:5px 12px;border-radius:4px">CAP ${v.cap}</span>`:""}<button class="close-btn" style="background:${C.ch2};color:${C.sv};margin-left:8px;width:32px;height:32px;font-size:20px" onclick="setState({sel:null})">\u00d7</button></div></div>`;
// Dropdown
h+=`<div style="padding:10px 24px;background:${C.w};border-bottom:1px solid ${C.dk};display:flex;align-items:center;gap:8px;flex-shrink:0"><button class="btn btn-s" style="padding:6px 10px;font-size:14px;min-width:32px" onclick="setState({tab:Math.max(0,state.tab-1)})" ${state.tab===0?'disabled style="padding:6px 10px;font-size:14px;min-width:32px;opacity:0.3;cursor:default"':''}>←</button><select onchange="setState({tab:+this.value})" style="flex:1;padding:8px 12px;font-size:13px;font-family:var(--ui);font-weight:600;cursor:pointer">`;
SEC.forEach((s,i)=>{h+=`<option value="${i}" ${state.tab===i?"selected":""}>${s.n} \u2014 ${s.t}</option>`;});
h+=`</select><button class="btn btn-s" style="padding:6px 10px;font-size:14px;min-width:32px" onclick="setState({tab:Math.min(11,state.tab+1)})" ${state.tab===11?'disabled style="padding:6px 10px;font-size:14px;min-width:32px;opacity:0.3;cursor:default"':''}>→</button></div>`;
// Content
h+=`<div style="flex:1;overflow-y:auto;padding:20px 24px;background:${C.paper}">${secHTML(state.tab,v)}</div>`;
// Footer
h+=`<div style="padding:12px 24px;background:${C.w};border-top:1px solid ${C.dk};display:flex;justify-content:flex-end;flex-shrink:0"><button class="btn btn-p" onclick="openForm(${state.sel})">Generate Full Report</button></div>`;
}
h+=`</div>`;

// Form overlay
if(state.formOpen && state.formV) h+=formHTML();

document.getElementById("app").innerHTML=h;

// After render, if generating, kick off the animation

}

render();
</script>
</body>
</html>
